<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="1; url=./java-vault.html">
  <meta name="theme-color" content="#f5f6f8">
  <title>Opening Ope' Code Vault</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      background: #f5f6f8;
      color: #17231f;
      font-family: "DM Sans", "Segoe UI", system-ui, sans-serif;
    }

    .splash {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      padding: 2rem 1.5rem;
      place-items: center;
      background:
        radial-gradient(ellipse at 50% 40%, #fff 0%, #fff 27%, transparent 68%),
        #f5f6f8;
    }

    .splash-content {
      display: grid;
      justify-items: center;
      width: min(100%, 28rem);
      text-align: center;
    }

    .mascot {
      display: block;
      width: clamp(10rem, 38vw, 15rem);
      height: auto;
      margin-bottom: 1.25rem;
      animation: float 3s ease-in-out infinite;
    }

    .eyebrow {
      margin: 0 0 0.6rem;
      color: #15745d;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 7vw, 2.35rem);
      letter-spacing: -0.045em;
    }

    .loading-copy {
      margin: 0.7rem 0 1.5rem;
      color: #78827d;
      font-size: 0.98rem;
    }

    .loading-indicator {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      color: #15745d;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .loading-indicator::before {
      width: 1rem;
      height: 1rem;
      border: 2px solid #cfe5db;
      border-top-color: #15745d;
      border-radius: 50%;
      content: "";
      animation: spin 0.8s linear infinite;
    }

    .enter-link {
      position: absolute;
      right: clamp(1rem, 4vw, 3rem);
      bottom: clamp(1rem, 4vw, 3rem);
      padding: 0.85rem 1.2rem;
      border-radius: 0.65rem;
      background: #15745d;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 650;
      text-decoration: none;
      box-shadow: 0 4px 16px rgb(23 35 31 / 22%);
    }

    .enter-link:hover,
    .enter-link:focus-visible {
      background: #105e4c;
    }

    .enter-link:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes float {
      50% {
        transform: translateY(-0.45rem);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="splash">
    <section class="splash-content" aria-labelledby="welcome-heading">
      <img class="mascot" src="./java-vault-mascot.svg" alt="A friendly green book mascot holding a coffee cup">
      <p class="eyebrow">Your learning library</p>
      <h1 id="welcome-heading">Your vault is getting ready.</h1>
      <p class="loading-copy">A little space for everything you’re learning.</p>
      <p class="loading-indicator" role="status">Opening your vault…</p>
    </section>
    <a class="enter-link" href="./java-vault.html">Open your vault</a>
  </main>
</body>
</html>
